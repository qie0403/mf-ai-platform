# MF-AI 工作台 主题配置（v1.1 · 深蓝黑版）
# 冷色调深色：黑/藏青/钢蓝，不要紫
#   - 主背景：深蓝炭灰 #14181F
#   - 卡片/输入框：石板灰 #1F2530
#   - 侧边栏：近黑 #0C0F14
#   - 主色：钢蓝 #4A90D9
[theme]
base = "dark"
primaryColor = "#4A90D9"
backgroundColor = "#14181F"
secondaryBackgroundColor = "#1F2530"
textColor = "#E6E9EF"
font = "sans serif"

[server]
# headless = false：本地 `streamlit run app.py` 时自动弹出浏览器。
# （headless = true 会让它只起服务、不打开浏览器，必须自己再输 localhost:8501）
# 容器里没有显示器，所以 Dockerfile 的启动命令里显式加了 --server.headless=true。
headless = false
runOnSave = true

[browser]
gatherUsageStats = false
